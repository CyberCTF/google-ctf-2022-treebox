# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Treebox (Google's 2022 security competition, by Google; a sandbox challenge) as an Isoloom spec:
# a Python sandbox that rejects any code with imports or calls, checked on the AST.
# The challenge folder 2022/quals/sandbox-treebox of Google's challenge archive is vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2022-treebox

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.194.0/24, internet: false}

machines:
  challenge:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    volumes: {ctf: /chroot/home/user}     # the flag, written by ctf/flag.sh at every start
    ports:
      challenge:
        port: 1337
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: app/challenge

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the sandbox asks for Python code
    script: checks/probe.sh
    wait: 60

message: |
  Treebox (Google, 2022) answers at `nc localhost {{ machines.challenge.ports.challenge.published }}`.
  No calls allowed in the AST: what Python syntax runs a function without looking like a call?
